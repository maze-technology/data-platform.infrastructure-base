kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
        preKubeadmCommands:
          - echo "172.17.0.1 host.docker.internal" >> /etc/hosts
    extraPortMappings:
      - containerPort: 80
        hostPort: 30080
        protocol: TCP
      - containerPort: 443
        hostPort: 30443
        protocol: TCP
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        preKubeadmCommands:
          - echo "172.17.0.1 host.docker.internal" >> /etc/hosts
    # Add more worker nodes as needed
  # - role: worker
