kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 30080
        protocol: TCP
      - containerPort: 443
        hostPort: 30443
        protocol: TCP
    # Allow access to host.docker.internal for LocalStack
    extraHosts:
      - host: host.docker.internal
        ip: 172.17.0.1
  - role: worker
    # Allow access to host.docker.internal for LocalStack
    extraHosts:
      - host: host.docker.internal
        ip: 172.17.0.1
    # Add more worker nodes as needed
  # - role: worker

