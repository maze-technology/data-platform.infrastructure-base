[Interface]
Address = ${CLIENT_IP}
MTU = 1280
PrivateKey = $(cat /config/${PEER_ID}/privatekey-${PEER_ID})
# Do NOT set DNS= here. wg-quick + resolvconf -x would send *all* queries to
# CoreDNS and break general internet if the tunnel/DNS path flaps. Instead,
# systemd-resolved split-DNS: only *.maze.trading (override via patch) → CoreDNS.
PostUp = resolvectl dns %i ${PEERDNS}; resolvectl domain %i ~REPLACE_DNS_DOMAIN; resolvectl default-route %i false
PostDown = resolvectl revert %i

[Peer]
PublicKey = $(cat /config/server/publickey-server)
PresharedKey = $(cat /config/${PEER_ID}/presharedkey-${PEER_ID})
Endpoint = ${SERVERURL}:${SERVERPORT}
AllowedIPs = ${ALLOWEDIPS}
