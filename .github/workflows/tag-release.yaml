name: Tag release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare_tag:
    name: Setup Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BUMP: patch
          WITH_V: true
