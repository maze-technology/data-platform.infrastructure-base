# OpenTofu CI for infrastructure-base (GitLab SoT).
# Ports useful GitHub workflows:
#   - opentofu-fmt-check.yaml → opentofu-fmt template
#   - release-approval.yaml  → release-approval template (manual gate on MRs → main)
#   - tag-release.yaml       → tag-release template (patch tag on main)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"

stages:
  - validate
  - publish

include:
  # Local include of tag-release never registered jobs on this project (only
  # opentofu_fmt_* ever ran). Use the same project include consumers use.
  - local: "/ci/templates/opentofu-fmt-check.gitlab-ci.yml"
  - local: "/ci/templates/release-approval.gitlab-ci.yml"
  - project: "data-platform/infrastructure-base"
    ref: "v0.2.19"
    file: "/ci/templates/tag-release.gitlab-ci.yml"
