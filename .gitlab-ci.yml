# OpenTofu CI for infrastructure-base (GitLab SoT).
# Local templates:
#   - opentofu-fmt-check → fmt on MRs/develop
#   - release-approval   → manual gate on MRs → main
#   - tag-release        → patch tag on main
#   - workflow-auto-cancel → cancel superseded interruptible jobs

include:
  - local: "/ci/templates/workflow-auto-cancel.gitlab-ci.yml"
  - local: "/ci/templates/opentofu-fmt-check.gitlab-ci.yml"
  - local: "/ci/templates/release-approval.gitlab-ci.yml"
  # Component includes need explicit inputs; without them jobs were dropped.
  - local: "/ci/templates/tag-release.gitlab-ci.yml"
    inputs:
      with_v: "true"
      initial_version: "0.0.1"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"

stages:
  - validate
  - publish
