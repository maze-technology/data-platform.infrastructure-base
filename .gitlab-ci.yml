# OpenTofu CI for infrastructure-base (GitLab SoT).
# Ports useful GitHub workflows:
#   - opentofu-fmt-check.yaml → opentofu-fmt template
#   - release-approval.yaml  → release-approval template (manual gate on MRs → main)
#   - tag-release.yaml       → tag-release template (patch tag on main)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"

stages:
  - validate
  - publish

include:
  - local: "/ci/templates/opentofu-fmt-check.gitlab-ci.yml"
  - local: "/ci/templates/release-approval.gitlab-ci.yml"
  # Explicit inputs: local component include without inputs previously failed to
  # register tag_release/gitlab_release on this project (job history was fmt-only).
  - local: "/ci/templates/tag-release.gitlab-ci.yml"
    inputs:
      with_v: "true"
      initial_version: "0.0.1"
