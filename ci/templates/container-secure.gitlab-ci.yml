# Container security for Maze repos (GitLab CE).
#
# Trivy now runs inside `container_build` (local docker-save tar, no registry
# pull, no job artifact upload). This template is kept so existing includes
# keep working; the standalone `trivy` job is a no-op marker.
#
# Prefer configuring scan knobs on container-publish:
#   inputs:
#     trivy_severity: HIGH
#     trivy_extra_args: '--skip-files "**/cnb/lifecycle/**"'
#
# Fail policy lives on container_build rules:
#   MR / non-default branches: hard fail
#   Default branch (main): allow_failure so FF release pipelines stay green

spec:
  inputs:
    severity:
      description: Unused (scan severity is configured on container-publish trivy_severity)
      default: HIGH

---

stages:
  - secure

trivy:
  stage: secure
  interruptible: true
  image:
    name: alpine:3.24
    entrypoint: [""]
  needs:
    - job: container_build
  script:
    - echo "Trivy already ran in container_build (local image tar). Nothing to do."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
