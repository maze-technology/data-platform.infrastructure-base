# Auto patch-tag on push to main (GitHub publish.yaml parity) + GitLab Release notes.
#
# Old GitHub flow: push to main → bump patch tag → publish used that version.
# GitLab publish jobs already run on $CI_COMMIT_TAG; tag_release only creates the tag
# and triggers the tag pipeline. gitlab_release (same include) creates the Release.
#
# Include:
#   include:
#     - project: "data-platform/infrastructure-base"
#       ref: "develop"
#       file: "/ci/templates/tag-release.gitlab-ci.yml"
#
# Auth (group/project CI variable, masked):
#   GITLAB_TAG_TOKEN — Group/Project Access Token with api + write_repository
#   (CI_JOB_TOKEN is tried as fallback but often cannot create tags on CE.)
#
# Loop-safe: tag_release never runs on tag pipelines. Creating a tag starts a
# separate pipeline that runs publish + gitlab_release.

spec:
  inputs:
    with_v:
      description: Prefix tags with v (v0.1.2)
      default: "true"
    initial_version:
      description: First tag when the repo has none
      default: "0.0.1"

---

tag_release:
  stage: .pre
  image:
    name: alpine:3.24
    entrypoint: [""]
  variables:
    FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "false"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -euo pipefail
      apk add --no-cache curl jq git >/dev/null

      TOKEN="${GITLAB_TAG_TOKEN:-${CI_JOB_TOKEN:-}}"
      if [ -z "${TOKEN}" ]; then
        echo "ERROR: set GITLAB_TAG_TOKEN (api + write_repository) for tag_release" >&2
        exit 1
      fi

      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      AUTH_HEADER="PRIVATE-TOKEN: ${TOKEN}"
      # Job-token auth uses a different header when falling back
      if [ -z "${GITLAB_TAG_TOKEN:-}" ]; then
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi

      # Idempotent: skip if this SHA already has a version tag
      EXISTING="$(curl -fsS --header "${AUTH_HEADER}" \
        "${API}/repository/commits/${CI_COMMIT_SHA}/refs?type=tag" \
        | jq -r '.[].name' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true)"
      if [ -n "${EXISTING}" ]; then
        echo "SHA ${CI_COMMIT_SHA} already tagged: ${EXISTING}"
        exit 0
      fi

      LATEST="$(curl -fsS --header "${AUTH_HEADER}" \
        "${API}/repository/tags?per_page=100" \
        | jq -r '.[].name' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
        | sed 's/^v//' | sort -V | tail -1 || true)"

      if [ -z "${LATEST}" ]; then
        NEXT="$[[ inputs.initial_version ]]"
      else
        NEXT="$(printf '%s' "${LATEST}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')"
      fi

      if [ "$[[ inputs.with_v ]]" = "true" ]; then
        TAG="v${NEXT}"
      else
        TAG="${NEXT}"
      fi

      echo "Creating tag ${TAG} on ${CI_COMMIT_SHA} (was ${LATEST:-<none>})"
      HTTP="$(curl -sS -o /tmp/tag_resp.json -w '%{http_code}' --request POST \
        --header "${AUTH_HEADER}" \
        --header "Content-Type: application/json" \
        --data "{\"tag_name\":\"${TAG}\",\"ref\":\"${CI_COMMIT_SHA}\",\"message\":\"Release ${TAG}\"}" \
        "${API}/repository/tags")"

      if [ "${HTTP}" = "201" ] || [ "${HTTP}" = "200" ]; then
        echo "Created ${TAG}"
        cat /tmp/tag_resp.json | jq -r '.name // .'
        # API tag create does not reliably start a CI pipeline on this GitLab CE.
        # Explicitly trigger so container_publish can push :${TAG} (and secure jobs).
        PIPE_HTTP="$(curl -sS -o /tmp/tag_pipe.json -w '%{http_code}' --request POST \
          --header "${AUTH_HEADER}" \
          --header "Content-Type: application/json" \
          --data "{\"ref\":\"${TAG}\"}" \
          "${API}/pipeline")"
        if [ "${PIPE_HTTP}" = "201" ] || [ "${PIPE_HTTP}" = "200" ]; then
          echo "Triggered pipeline for ${TAG}: $(jq -r '.id // .' /tmp/tag_pipe.json)"
        else
          echo "WARN: create tag ok but pipeline trigger HTTP ${PIPE_HTTP}" >&2
          cat /tmp/tag_pipe.json >&2 || true
        fi
        exit 0
      fi

      # Race: another pipeline created the same tag
      if [ "${HTTP}" = "400" ] && grep -qi 'already exists' /tmp/tag_resp.json; then
        echo "Tag ${TAG} already exists — ok"
        # Still ensure a tag pipeline exists / can be triggered
        PIPE_HTTP="$(curl -sS -o /tmp/tag_pipe.json -w '%{http_code}' --request POST \
          --header "${AUTH_HEADER}" \
          --header "Content-Type: application/json" \
          --data "{\"ref\":\"${TAG}\"}" \
          "${API}/pipeline")"
        echo "Pipeline trigger for existing ${TAG}: HTTP ${PIPE_HTTP}"
        cat /tmp/tag_pipe.json | jq -r '.id // .' 2>/dev/null || true
        exit 0
      fi

      echo "ERROR: create tag HTTP ${HTTP}" >&2
      cat /tmp/tag_resp.json >&2 || true
      exit 1

# GitLab Release with changelog notes (runs on the tag pipeline).
gitlab_release:
  stage: .post
  image:
    name: alpine:3.24
    entrypoint: [""]
  variables:
    FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "false"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -euo pipefail
      apk add --no-cache curl jq >/dev/null

      TOKEN="${GITLAB_TAG_TOKEN:-${CI_JOB_TOKEN:-}}"
      if [ -z "${TOKEN}" ]; then
        echo "ERROR: set GITLAB_TAG_TOKEN (or rely on CI_JOB_TOKEN) for gitlab_release" >&2
        exit 1
      fi

      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      if [ -n "${GITLAB_TAG_TOKEN:-}" ]; then
        AUTH_HEADER="PRIVATE-TOKEN: ${TOKEN}"
      else
        AUTH_HEADER="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi

      TAG="${CI_COMMIT_TAG}"
      VER="${TAG#v}"

      # Prefer trailer-based changelog; fall back to commit titles between tags.
      NOTES="$(curl -fsS --header "${AUTH_HEADER}" \
        "${API}/repository/changelog?version=${VER}" \
        | jq -r '.notes // empty' || true)"

      if [ -z "${NOTES}" ] || printf '%s' "${NOTES}" | grep -qi 'No changes'; then
        PREV_TAG="$(curl -fsS --header "${AUTH_HEADER}" \
          "${API}/repository/tags?per_page=100" \
          | jq -r '.[].name' \
          | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
          | grep -vxF "${TAG}" \
          | sed 's/^v//' | sort -V | tail -1 || true)"
        if [ -n "${PREV_TAG}" ]; then
          # Match actual tag spelling (with or without v)
          PREV_REF="$(curl -fsS --header "${AUTH_HEADER}" \
            "${API}/repository/tags?per_page=100" \
            | jq -r '.[].name' \
            | grep -E "^v?${PREV_TAG}$" | head -1 || true)"
          PREV_REF="${PREV_REF:-${PREV_TAG}}"
          COMMITS="$(curl -fsS -G --header "${AUTH_HEADER}" \
            --data-urlencode "from=${PREV_REF}" \
            --data-urlencode "to=${TAG}" \
            "${API}/repository/compare" \
            | jq -r '.commits // [] | reverse | .[] | "- \(.title)"' || true)"
        else
          COMMITS=""
        fi
        if [ -n "${COMMITS}" ]; then
          NOTES="$(printf '## %s\n\n%s\n' "${VER}" "${COMMITS}")"
        else
          NOTES="$(printf '## %s\n\nRelease %s.\n' "${VER}" "${TAG}")"
        fi
      fi

      echo "Creating GitLab Release ${TAG}"
      echo "${NOTES}"

      BODY="$(jq -n --arg tag "${TAG}" --arg name "${TAG}" --arg desc "${NOTES}" \
        '{tag_name:$tag, name:$name, description:$desc}')"

      HTTP="$(curl -sS -o /tmp/release_resp.json -w '%{http_code}' --request POST \
        --header "${AUTH_HEADER}" \
        --header "Content-Type: application/json" \
        --data "${BODY}" \
        "${API}/releases")"

      if [ "${HTTP}" = "201" ] || [ "${HTTP}" = "200" ]; then
        echo "Created release ${TAG}"
        jq -r '.tag_name // .message // .' /tmp/release_resp.json
        exit 0
      fi

      if [ "${HTTP}" = "409" ] || grep -qiE 'already been taken|already exists' /tmp/release_resp.json; then
        echo "Release ${TAG} already exists — updating description"
        HTTP2="$(curl -sS -o /tmp/release_upd.json -w '%{http_code}' --request PUT \
          --header "${AUTH_HEADER}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg desc "${NOTES}" '{description:$desc}')" \
          "${API}/releases/$(printf '%s' "${TAG}" | sed 's|/|%2F|g')")"
        echo "Update HTTP ${HTTP2}"
        jq -r '.tag_name // .message // .' /tmp/release_upd.json 2>/dev/null || cat /tmp/release_upd.json
        exit 0
      fi

      echo "ERROR: create release HTTP ${HTTP}" >&2
      cat /tmp/release_resp.json >&2 || true
      exit 1
