# Build + local Trivy on every pipeline; publish to the registry only from
# main (default branch) and version tags.
#
# Large Paketo images (~500Mi+) cannot be passed as GitLab job artifacts
# (coordinator returns 413), so the build job scans a local docker-save tar
# in-place (never uploaded). Publish rebuilds on main/tags, then pushes.
#
# Include:
#
#   include:
#     - project: 'iac/infrastructure-base'
#       file: '/ci/templates/container-publish.gitlab-ci.yml'
#       inputs:
#         dockerfile: Dockerfile
#         context: .
#     - project: 'iac/infrastructure-base'
#       file: '/ci/templates/container-secure.gitlab-ci.yml'
#
# Optional CI/CD variables (project or group) for Hub mirror on publish:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DOCKERHUB_REPOSITORY

spec:
  inputs:
    dockerfile:
      description: Path to Dockerfile relative to context (ignored when build_script is set)
      default: Dockerfile
    context:
      description: Docker build context directory (ignored when build_script is set)
      default: "."
    build_script:
      description: >
        Optional shell to produce the image already tagged as PUBLISH_IMAGE:PUBLISH_TAG
        (e.g. gradle bootBuildImage). Empty = docker build -f dockerfile.
      default: ""
    image_name:
      description: GitLab registry image (runtime source of truth)
      default: $CI_REGISTRY_IMAGE
    tag:
      description: Primary image tag
      default: $CI_COMMIT_SHA
    push_latest:
      description: Also tag and push :latest on the default branch
      default: "true"
    dockerhub_enabled:
      description: "auto = push when DOCKERHUB_* vars set; true/false to force"
      default: "auto"
    job_image:
      description: CI job image (use a JDK image when build_script needs the toolchain)
      default: docker:29.7.2
    use_sdkman:
      description: If "true", install SDKMAN and sdk env install when .sdkmanrc is present
      default: "true"
    trivy_image:
      description: Trivy scanner image used for local tar scans after build
      default: aquasec/trivy:0.76.2
    trivy_severity:
      description: Minimum severity that fails the build scan (Critical always included)
      default: HIGH
    trivy_extra_args:
      description: Extra args appended to `trivy image` (e.g. Paketo --skip-files)
      default: ""

---

stages:
  - build
  - publish

variables:
  PUBLISH_IMAGE: $[[ inputs.image_name ]]
  PUBLISH_TAG: $[[ inputs.tag ]]
  PUBLISH_DOCKERFILE: $[[ inputs.dockerfile ]]
  PUBLISH_CONTEXT: $[[ inputs.context ]]
  PUBLISH_PUSH_LATEST: $[[ inputs.push_latest ]]
  PUBLISH_DOCKERHUB: $[[ inputs.dockerhub_enabled ]]
  SECURE_IMAGE: $[[ inputs.image_name ]]:$[[ inputs.tag ]]
  TRIVY_IMAGE: $[[ inputs.trivy_image ]]
  TRIVY_FAIL_SEVERITY: $[[ inputs.trivy_severity ]],CRITICAL
  TRIVY_EXTRA_ARGS: $[[ inputs.trivy_extra_args ]]

.container_docker_job:
  interruptible: true
  image:
    name: $[[ inputs.job_image ]]
    entrypoint: [""]
  services:
    - name: docker:29.7.2-dind
      alias: docker
      command: ["--tls=false"]
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
    KUBERNETES_HELPER_MEMORY_LIMIT: "512Mi"
    KUBERNETES_SERVICE_MEMORY_REQUEST: "1Gi"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "2Gi"
  before_script:
    - |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$CI_PROJECT_DIR/.gradle}"
      mkdir -p "${GRADLE_USER_HOME}"
      if ! command -v docker >/dev/null 2>&1; then
        echo "Fetching Docker CLI static binary"
        curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz" \
          | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      fi
      if [ "$[[ inputs.use_sdkman ]]" = "true" ] && [ -f .sdkmanrc ]; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq curl unzip zip ca-certificates >/dev/null
        fi
        echo "=== container job: SDKMAN (.sdkmanrc present) ==="
        export SDKMAN_DIR="${SDKMAN_DIR:-$HOME/.sdkman}"
        if [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "SDKMAN install attempt ${attempt}/5"
            if curl -fsS --retry 3 --retry-delay 2 "https://get.sdkman.io" | bash; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" != "1" ] || [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
            echo "WARN: SDKMAN install failed; falling back to image JDK" >&2
          fi
        fi
        if [ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
          set +eu
          # shellcheck disable=SC1091
          . "$SDKMAN_DIR/bin/sdkman-init.sh"
          sdk env install || echo "WARN: sdk env install failed; falling back to image JDK" >&2
          set -eu
          if [ -x "${SDKMAN_DIR}/candidates/java/current/bin/java" ]; then
            export JAVA_HOME="${SDKMAN_DIR}/candidates/java/current"
            export PATH="${JAVA_HOME}/bin:${PATH}"
            echo "JAVA_HOME=${JAVA_HOME}"
          fi
        fi
      fi
      if command -v java >/dev/null 2>&1; then
        java -version
      fi
      echo "Waiting for docker daemon at ${DOCKER_HOST}"
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          echo "docker ready (${i}s)"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "ERROR: docker daemon not ready" >&2
          exit 1
        fi
        sleep 1
      done


container_build:
  extends: .container_docker_job
  stage: build
  cache:
    key: gradle-user-home
    paths:
      - .gradle/wrapper/
      - .gradle/caches/
    policy: pull-push
  script:
    - |
      set -euo pipefail
      export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$CI_PROJECT_DIR/.gradle}"
      GITLAB_REF="${PUBLISH_IMAGE}:${PUBLISH_TAG}"
      echo "Build target → ${GITLAB_REF}"
      CUSTOM_BUILD="$[[ inputs.build_script ]]"
      if [ -n "${CUSTOM_BUILD}" ]; then
        echo "Custom build → ${GITLAB_REF}"
        eval "${CUSTOM_BUILD}"
      else
        echo "Building ${GITLAB_REF} (Dockerfile=${PUBLISH_DOCKERFILE} context=${PUBLISH_CONTEXT})"
        docker build -f "${PUBLISH_DOCKERFILE}" -t "${GITLAB_REF}" "${PUBLISH_CONTEXT}"
      fi
      docker image inspect "${GITLAB_REF}" >/dev/null
    - |
      set -euo pipefail
      GITLAB_REF="${PUBLISH_IMAGE}:${PUBLISH_TAG}"
      # Local tar for Trivy only — never uploaded as a CI artifact (413 on ~500Mi).
      SCAN_TAR="$(mktemp /tmp/ci-built-image.XXXXXX.tar)"
      trap 'rm -f "${SCAN_TAR}"' EXIT
      echo "Saving ${GITLAB_REF} → ${SCAN_TAR} for local Trivy scan"
      docker save "${GITLAB_REF}" -o "${SCAN_TAR}"
      ls -lh "${SCAN_TAR}"
      # Install Trivy into the job container so --input can read the local tar
      # (docker run -v would mount from the DinD VM, not this job filesystem).
      TRIVY_VER="${TRIVY_IMAGE##*:}"
      echo "Installing trivy ${TRIVY_VER}"
      curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER#v}/trivy_${TRIVY_VER#v}_Linux-64bit.tar.gz" \
        | tar -xz -C /usr/local/bin trivy
      echo "Scanning local image tar (fail on ${TRIVY_FAIL_SEVERITY})"
      # shellcheck disable=SC2086
      trivy image \
        --input "${SCAN_TAR}" \
        --exit-code 1 \
        --severity "${TRIVY_FAIL_SEVERITY}" \
        --ignore-unfixed \
        --no-progress \
        --format table \
        ${TRIVY_EXTRA_ARGS}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: false
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      allow_failure: false
    - if: $CI_COMMIT_TAG
      allow_failure: false

container_publish:
  extends: .container_docker_job
  stage: publish
  needs:
    - job: container_build
  cache:
    key: gradle-user-home
    paths:
      - .gradle/wrapper/
      - .gradle/caches/
    policy: pull
  script:
    - |
      set -euo pipefail
      export GRADLE_USER_HOME="${GRADLE_USER_HOME:-$CI_PROJECT_DIR/.gradle}"
      GITLAB_REF="${PUBLISH_IMAGE}:${PUBLISH_TAG}"
      echo "Build target → ${GITLAB_REF}"
      CUSTOM_BUILD="$[[ inputs.build_script ]]"
      if [ -n "${CUSTOM_BUILD}" ]; then
        echo "Custom build → ${GITLAB_REF}"
        eval "${CUSTOM_BUILD}"
      else
        echo "Building ${GITLAB_REF} (Dockerfile=${PUBLISH_DOCKERFILE} context=${PUBLISH_CONTEXT})"
        docker build -f "${PUBLISH_DOCKERFILE}" -t "${GITLAB_REF}" "${PUBLISH_CONTEXT}"
      fi
      docker image inspect "${GITLAB_REF}" >/dev/null
    - |
      set -euo pipefail
      gitlab_registry_login() {
        echo "Logging into GitLab registry ${CI_REGISTRY}"
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      }
      docker_push_retry() {
        local ref="$1"
        local attempt
        for attempt in 1 2 3; do
          gitlab_registry_login
          echo "Pushing ${ref} (attempt ${attempt}/3)"
          if docker push "${ref}"; then
            echo "Pushed ${ref}"
            return 0
          fi
          echo "WARN: docker push failed for ${ref} (attempt ${attempt}/3); will re-login and retry" >&2
          sleep $((attempt * 2))
        done
        echo "ERROR: docker push failed for ${ref} after 3 attempts" >&2
        return 1
      }

      GITLAB_REF="${PUBLISH_IMAGE}:${PUBLISH_TAG}"
      echo "Publishing runtime SoT → ${GITLAB_REF}"
      docker_push_retry "${GITLAB_REF}"

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VER_REF="${PUBLISH_IMAGE}:${CI_COMMIT_TAG}"
        docker tag "${GITLAB_REF}" "${VER_REF}"
        docker_push_retry "${VER_REF}"
      fi

      if [ "${PUBLISH_PUSH_LATEST}" = "true" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
        LATEST_REF="${PUBLISH_IMAGE}:latest"
        docker tag "${GITLAB_REF}" "${LATEST_REF}"
        docker_push_retry "${LATEST_REF}"
      fi

      DOCKERHUB_PUSH=false
      if [ "${PUBLISH_DOCKERHUB}" = "true" ]; then
        DOCKERHUB_PUSH=true
      elif [ "${PUBLISH_DOCKERHUB}" = "auto" ] && [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        DOCKERHUB_PUSH=true
      fi

      if [ "${DOCKERHUB_PUSH}" = "true" ]; then
        test -n "${DOCKERHUB_USERNAME:-}" || { echo "DOCKERHUB_USERNAME required"; exit 1; }
        test -n "${DOCKERHUB_TOKEN:-}" || { echo "DOCKERHUB_TOKEN required"; exit 1; }
        HUB_REPO="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/${CI_PROJECT_NAME}}"
        HUB_REF="${HUB_REPO}:${PUBLISH_TAG}"
        hub_push_retry() {
          local ref="$1"
          local attempt
          for attempt in 1 2 3; do
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            echo "Pushing Docker Hub ${ref} (attempt ${attempt}/3)"
            if docker push "${ref}"; then
              echo "Pushed ${ref}"
              return 0
            fi
            echo "WARN: Docker Hub push failed for ${ref} (attempt ${attempt}/3)" >&2
            sleep $((attempt * 2))
          done
          echo "ERROR: Docker Hub push failed for ${ref} after 3 attempts" >&2
          return 1
        }
        docker tag "${GITLAB_REF}" "${HUB_REF}"
        hub_push_retry "${HUB_REF}"
        echo "Pushed Docker Hub mirror → ${HUB_REF}"
        if [ "${PUBLISH_PUSH_LATEST}" = "true" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
          docker tag "${GITLAB_REF}" "${HUB_REPO}:latest"
          hub_push_retry "${HUB_REPO}:latest"
        fi
      else
        echo "Docker Hub push skipped (set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN to enable)"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
