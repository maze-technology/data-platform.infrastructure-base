# Reusable Maven publish to GitLab group Package Registry.
#
# Include from a library/specs .gitlab-ci.yml:
#
#   include:
#     - project: "data-platform/infrastructure-base"
#       ref: "main"
#       file: "/ci/templates/maven-publish.gitlab-ci.yml"
#       inputs:
#         job_image: eclipse-temurin:21-jdk
#
# Publishes with ./gradlew publish using:
#   GITLAB_MAVEN_URL   (default: https://scm.maze.trading/api/v4/groups/6/-/packages/maven)
#   GITLAB_MAVEN_USER  (default: gitlab-ci-token)
#   CI_JOB_TOKEN for publish (write); group Deploy Token GITLAB_MAVEN_* for local/read

spec:
  inputs:
    job_image:
      description: CI job image with JDK
      default: eclipse-temurin:21-jdk
    gradle_args:
      description: Extra args passed to ./gradlew publish
      default: ""
    version_property:
      description: If "true", pass -Pversion=<CI_COMMIT_TAG> when tagged
      default: "true"

---

stages:
  - publish

maven_publish:
  stage: publish
  image:
    name: $[[ inputs.job_image ]]
    entrypoint: [""]
  variables:
    FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "true"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - |
      set -eu
      export GITLAB_MAVEN_URL="${GITLAB_MAVEN_URL:-https://scm.maze.trading/api/v4/groups/6/-/packages/maven}"
      # Publish needs write_package_registry — always prefer CI_JOB_TOKEN over read-only Deploy Token.
      if [ -n "${CI_JOB_TOKEN:-}" ]; then
        export GITLAB_MAVEN_USER=gitlab-ci-token
        export GITLAB_MAVEN_PASSWORD="$CI_JOB_TOKEN"
      else
        export GITLAB_MAVEN_USER="${GITLAB_MAVEN_USER:-gitlab-ci-token}"
        export GITLAB_MAVEN_PASSWORD="${GITLAB_MAVEN_PASSWORD:-${GITLAB_TOKEN:-}}"
      fi
      if [ -z "${GITLAB_MAVEN_PASSWORD}" ]; then
        echo "ERROR: set CI_JOB_TOKEN, GITLAB_MAVEN_PASSWORD, or GITLAB_TOKEN" >&2
        exit 1
      fi
      echo "GITLAB_MAVEN_URL=${GITLAB_MAVEN_URL}"
      echo "GITLAB_MAVEN_USER=${GITLAB_MAVEN_USER}"
      java -version
      chmod +x ./gradlew
  script:
    - |
      set -eu
      VERSION_ARGS=""
      if [ "$[[ inputs.version_property ]]" = "true" ] && [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION_ARGS="-Pversion=${CI_COMMIT_TAG}"
      fi
      # shellcheck disable=SC2086
      ./gradlew --no-daemon ${VERSION_ARGS} $[[ inputs.gradle_args ]] publish
