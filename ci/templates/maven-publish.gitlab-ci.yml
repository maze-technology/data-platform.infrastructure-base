# Reusable Maven publish to GitLab group Package Registry (Smithy/Java libraries).
#
# Include from a library/specs .gitlab-ci.yml:
#
#   include:
#     - project: "data-platform/infrastructure-base"
#       ref: "main"
#       file: "/ci/templates/maven-publish.gitlab-ci.yml"
#       inputs:
#         job_image: eclipse-temurin:21-jdk
#
# Flow (matches former GitHub commons publish):
#   apt deps → optional SDKMAN (.sdkmanrc) → optional smithy tools → codegen pre_publish → ./gradlew publish
#   Job requests 2Gi/6Gi (runner default 1536Mi OOMs on Gradle).
#   Publish URL is project Package Registry (group Maven URL is resolve-only).
#
# Auth:
#   Publish URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven (group URL returns 415 on PUT)
#   Resolve (smithy-build): keep group CI vars GITLAB_MAVEN_USER/PASSWORD (Deploy Token)
#   Publish write: switch to gitlab-ci-token + $CI_JOB_TOKEN just before ./gradlew publish
#   Consumers resolve via group URL https://scm.maze.trading/api/v4/groups/6/-/packages/maven

spec:
  inputs:
    job_image:
      description: CI job image with JDK (temurin + apt-get for tooling)
      default: eclipse-temurin:21-jdk
    pre_publish:
      description: Shell before ./gradlew publish. Default runs smithy/buf codegen targets shared by commons and specs Makefiles (not full make build).
      default: "make generate-proto inject-protovalidate-validations buf-codegen"
    use_sdkman:
      description: If "true", install SDKMAN and sdk env install when .sdkmanrc is present
      default: "true"
    install_smithy_tools:
      description: If "true", install Smithy CLI, coursier, smithytranslate, buf, python3
      default: "true"
    gradle_args:
      description: Extra args passed to ./gradlew publish
      default: ""
    version_property:
      description: If "true", pass -Pversion=<CI_COMMIT_TAG> when tagged
      default: "true"

---

stages:
  - publish

maven_publish:
  stage: publish
  image:
    name: $[[ inputs.job_image ]]
    entrypoint: [""]
  variables:
    FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "true"
    # Submodules use git@scm / git@github.com URLs; init manually with HTTPS rewrite in before_script.
    GIT_SUBMODULE_STRATEGY: "none"
    SMITHY_VERSION: "1.72.1"
    SMITHYTRANSLATE_VERSION: "0.7.6"
    BUF_VERSION: "1.55.1"
    # Runner chart default is 1536Mi — too small for Gradle/SDKMAN/smithy tooling.
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
    KUBERNETES_HELPER_MEMORY_LIMIT: "512Mi"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - |
      set -eu
      echo "=== maven_publish: env setup ==="
      # Publish PUT must target the project registry (group URL returns 415).
      export GITLAB_MAVEN_URL="${GITLAB_MAVEN_PUBLISH_URL:-${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven}"
      # Keep group Deploy Token (GITLAB_MAVEN_USER/PASSWORD) for smithy-build.json dependency
      # resolution. Do NOT replace with CI_JOB_TOKEN here — job tokens cannot read other
      # projects' packages under inbound job-token allowlists.
      if [ -z "${CI_JOB_TOKEN:-}" ] && [ -z "${GITLAB_MAVEN_PASSWORD:-}" ] && [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "ERROR: set CI_JOB_TOKEN (publish) and/or GITLAB_MAVEN_PASSWORD (resolve)" >&2
        exit 1
      fi
      echo "GITLAB_MAVEN_URL=${GITLAB_MAVEN_URL}"
      echo "GITLAB_MAVEN_USER=${GITLAB_MAVEN_USER:-<unset>}"
      echo "has_GITLAB_MAVEN_PASSWORD=$([ -n "${GITLAB_MAVEN_PASSWORD:-}" ] && echo yes || echo no)"
      echo "has_CI_JOB_TOKEN=$([ -n "${CI_JOB_TOKEN:-}" ] && echo yes || echo no)"
      echo "CI_COMMIT_REF_NAME=${CI_COMMIT_REF_NAME:-}"
      echo "CI_COMMIT_SHA=${CI_COMMIT_SHA:-}"
      echo "PWD=$(pwd)"
      ls -la || true

      echo "=== maven_publish: apt packages ==="
      export DEBIAN_FRONTEND=noninteractive
      # Keep apt lean: nodejs/npm are huge and contention-prone on runners.
      # buf is installed from the official GitHub release binary below.
      apt-get update -qq
      apt-get install -y -qq curl unzip zip ca-certificates python3 make git >/dev/null
      echo "python3=$(python3 --version 2>&1)"
      echo "make=$(make --version 2>&1 | head -n1 || true)"
      echo "git=$(git --version 2>&1 || true)"

      if [ -f .gitmodules ]; then
        echo "=== maven_publish: git submodules (CI HTTPS for GitLab SSH URLs) ==="
        # Runners authenticate to scm via job token, not deploy keys.
        git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@scm.maze.trading/".insteadOf "git@scm.maze.trading:"
        # Legacy: keep GitHub HTTPS rewrite if any submodule still points there.
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule sync --recursive
        git submodule update --init --recursive
        git submodule status --recursive || true
      fi

      if [ "$[[ inputs.use_sdkman ]]" = "true" ] && [ -f .sdkmanrc ]; then
        echo "=== maven_publish: SDKMAN (.sdkmanrc present) ==="
        export SDKMAN_DIR="${SDKMAN_DIR:-$HOME/.sdkman}"
        if [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
          # api.sdkman.io occasionally 503s under parallel CI; retry a few times.
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "SDKMAN install attempt ${attempt}/5"
            if curl -fsS --retry 3 --retry-delay 2 "https://get.sdkman.io" | bash; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" != "1" ] || [ ! -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
            echo "WARN: SDKMAN install failed; falling back to image JDK" >&2
          fi
        fi
        if [ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]; then
          # SDKMAN scripts are not nounset-safe (sdk env install hits unbound $3).
          # shellcheck disable=SC1091
          set +eu
          . "$SDKMAN_DIR/bin/sdkman-init.sh"
          sdk env install || echo "WARN: sdk env install failed; falling back to image JDK" >&2
          set -eu
          if [ -x "${SDKMAN_DIR}/candidates/java/current/bin/java" ]; then
            export JAVA_HOME="${SDKMAN_DIR}/candidates/java/current"
            export PATH="${JAVA_HOME}/bin:${PATH}"
            echo "JAVA_HOME=${JAVA_HOME}"
          fi
        fi
      else
        echo "=== maven_publish: using image JDK (use_sdkman=$[[ inputs.use_sdkman ]], sdkmanrc=$([ -f .sdkmanrc ] && echo yes || echo no)) ==="
      fi
      java -version
      chmod +x ./gradlew

      if [ "$[[ inputs.install_smithy_tools ]]" = "true" ]; then
        echo "=== maven_publish: Smithy CLI ${SMITHY_VERSION} ==="
        # Specs Makefiles call `smithy build`; commons only needs smithytranslate, but CLI is cheap.
        SMITHY_TMP="$(mktemp -d)"
        curl -fsSL "https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip" \
          -o "${SMITHY_TMP}/smithy-cli.zip"
        unzip -qo "${SMITHY_TMP}/smithy-cli.zip" -d "${SMITHY_TMP}"
        # Installer is root-friendly in CI (no sudo needed).
        "${SMITHY_TMP}/smithy-cli-linux-x86_64/install"
        rm -rf "${SMITHY_TMP}"
        command -v smithy
        smithy --help >/dev/null
        smithy version || true

        echo "=== maven_publish: coursier + smithytranslate ${SMITHYTRANSLATE_VERSION} ==="
        CS_BIN="${HOME}/.local/share/coursier/bin"
        mkdir -p "${HOME}/.local/bin" "${CS_BIN}"
        if ! command -v cs >/dev/null 2>&1; then
          curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" | gzip -d > "${HOME}/.local/bin/cs"
          chmod +x "${HOME}/.local/bin/cs"
          export PATH="${HOME}/.local/bin:${PATH}"
          cs setup --yes || true
        fi
        export PATH="${HOME}/.local/bin:${CS_BIN}:${PATH}"
        cs install --channel https://disneystreaming.github.io/coursier.json "smithytranslate:${SMITHYTRANSLATE_VERSION}"
        export PATH="${CS_BIN}:${PATH}"
        command -v smithytranslate
        smithytranslate --help >/dev/null 2>&1 || smithytranslate version || true

        echo "=== maven_publish: buf ${BUF_VERSION} ==="
        # Official binary only (avoid apt/npm node on runners).
        if ! curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf; then
          echo "ERROR: failed to download buf v${BUF_VERSION} binary" >&2
          exit 1
        fi
        chmod +x /usr/local/bin/buf
        command -v buf
        buf --version
      else
        echo "=== maven_publish: skipping smithy tools (install_smithy_tools=false) ==="
      fi
  script:
    - |
      set -eu
      fail_diag() {
        ec=$?
        echo "=== maven_publish FAILURE diagnostics ===" >&2
        echo "exit_code=${ec} pwd=$(pwd)" >&2
        echo "JAVA_HOME=${JAVA_HOME:-}" >&2
        java -version >&2 || true
        echo "PATH=${PATH:-}" >&2
        command -v smithytranslate >&2 || echo "smithytranslate: missing" >&2
        command -v buf >&2 || echo "buf: missing" >&2
        command -v python3 >&2 || echo "python3: missing" >&2
        ls -la >&2 || true
        ls -la build 2>/dev/null >&2 || echo "no build/ dir" >&2
      }
      trap fail_diag ERR

      PRE_PUBLISH='$[[ inputs.pre_publish ]]'
      # Trim accidental whitespace from input interpolation
      PRE_PUBLISH=$(printf '%s' "$PRE_PUBLISH" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
      if [ -n "$PRE_PUBLISH" ]; then
        if [ ! -f Makefile ] && echo "$PRE_PUBLISH" | grep -q '^make '; then
          echo "=== maven_publish: skipping pre_publish '${PRE_PUBLISH}' (no Makefile) ==="
        else
          echo "=== maven_publish: pre_publish: ${PRE_PUBLISH} ==="
          eval "$PRE_PUBLISH"
        fi
      else
        echo "=== maven_publish: pre_publish empty, skipping ==="
      fi

      VERSION_ARGS=""
      if [ "$[[ inputs.version_property ]]" = "true" ] && [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION_ARGS="-Pversion=${CI_COMMIT_TAG}"
      fi
      # Switch credentials to job token for Package Registry write (Deploy Token is read-only).
      if [ -n "${CI_JOB_TOKEN:-}" ]; then
        export GITLAB_MAVEN_USER=gitlab-ci-token
        export GITLAB_MAVEN_PASSWORD="$CI_JOB_TOKEN"
      else
        export GITLAB_MAVEN_USER="${GITLAB_MAVEN_USER:-gitlab-ci-token}"
        export GITLAB_MAVEN_PASSWORD="${GITLAB_MAVEN_PASSWORD:-${GITLAB_TOKEN:-}}"
      fi
      echo "=== maven_publish: ./gradlew ${VERSION_ARGS} $[[ inputs.gradle_args ]] publish (user=${GITLAB_MAVEN_USER}) ==="
      # shellcheck disable=SC2086
      ./gradlew --no-daemon --stacktrace ${VERSION_ARGS} $[[ inputs.gradle_args ]] publish
      echo "=== maven_publish: success ==="
  after_script:
    - |
      if [ "${CI_JOB_STATUS:-}" = "failed" ]; then
        echo "=== maven_publish after_script failure summary ==="
        echo "CI_JOB_STATUS=${CI_JOB_STATUS}"
        echo "CI_JOB_ID=${CI_JOB_ID:-}"
        echo "CI_PIPELINE_URL=${CI_PIPELINE_URL:-}"
        java -version || true
        ls -la || true
        ls -la build/libs 2>/dev/null || true
        ls -la build/publications 2>/dev/null || true
      fi
